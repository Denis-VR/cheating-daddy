name: Build

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test

    windows:
        needs: test
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run make
            - uses: actions/upload-artifact@v4
              with:
                  name: cheating-daddy-windows
                  path: out/make/squirrel.windows/**/*
                  if-no-files-found: error
